version: '3.9'

# Pahala Frontend — deployed via Portainer GitOps
# GitOps repo: hudihi/devops  Path: pahala/docker-compose.yml
# CI auto-updates the image tag on every push to main.

services:
  pahala-ui:
    image: ghcr.io/hudihi/hardware-hub-simple:latest
    container_name: pahala-ui
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.pahala-ui.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.pahala-ui.entrypoints=websecure"
      - "traefik.http.routers.pahala-ui.tls=true"
      - "traefik.http.routers.pahala-ui.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.pahala-ui.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - traefik

networks:
  traefik:
    external: true
